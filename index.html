<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yu Dojo — 技能修煉道場</title>
    <meta name="description" content="先看見一門技藝的完整邊界，再決定從哪裡開始 — 象棋、五子棋、攝影的全景學習地圖與修煉路線">
    <script>
        // Set the theme before first paint so a dark-mode reload never flashes white.
        (function () {
            var t;
            try { t = localStorage.getItem('yu-dojo-theme'); } catch (e) { /* private mode */ }
            if (!t) {
                t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared/css/base.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔</text></svg>">
</head>
<body>
    <div id="app"></div>
    <script src="shared/js/xiangqi-board.js"></script>
    <script src="shared/js/gomoku-board.js"></script>
    <script src="shared/js/router.js"></script>
</body>
</html>
